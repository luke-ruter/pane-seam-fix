name: Release

# Push a tag such as v1.1.0 to build the jar and publish it as a GitHub release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check tag matches mod version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MOD_VERSION=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' src/main/resources/fabric.mod.json | head -1)
          SCRIPT_VERSION=$(sed -n 's/^VERSION="\([^"]*\)".*/\1/p' build.sh | head -1)
          echo "tag=$TAG fabric.mod.json=$MOD_VERSION build.sh=$SCRIPT_VERSION"
          if [ "$TAG" != "$MOD_VERSION" ] || [ "$TAG" != "$SCRIPT_VERSION" ]; then
            echo "::error::Tag v$TAG must match the version in fabric.mod.json ($MOD_VERSION) and build.sh ($SCRIPT_VERSION)"
            exit 1
          fi

      - name: Build and test
        run: bash build.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.jar \
            --title "Pane Seam Fix $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
