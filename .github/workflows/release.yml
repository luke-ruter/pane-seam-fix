name: Release

# Every push to main (including merged pull requests) builds the jar. If the version in
# build.sh has no GitHub release yet, it creates tag v<version> at that commit and publishes
# the jar. Bump the version before merging to get a new release; otherwise nothing is published.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Read and check versions
        id: version
        run: |
          SCRIPT_VERSION=$(sed -n 's/^VERSION="\([^"]*\)".*/\1/p' build.sh | head -1)
          MOD_VERSION=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' src/main/resources/fabric.mod.json | head -1)
          echo "build.sh=$SCRIPT_VERSION fabric.mod.json=$MOD_VERSION"
          if [ "$SCRIPT_VERSION" != "$MOD_VERSION" ]; then
            echo "::error::Version mismatch: build.sh has $SCRIPT_VERSION but fabric.mod.json has $MOD_VERSION"
            exit 1
          fi
          echo "version=$SCRIPT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.version.outputs.version }} is already released; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test
        if: steps.existing.outputs.exists == 'false'
        run: bash build.sh

      - name: Create GitHub release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release create "$TAG" dist/*.jar \
            --target "$GITHUB_SHA" \
            --title "Pane Seam Fix $TAG" \
            --generate-notes
