name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and test
        run: bash build.sh

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: pane-seam-fix-jar
          path: dist/*.jar
          if-no-files-found: error
